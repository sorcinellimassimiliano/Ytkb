services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ytkb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ytkb}
      POSTGRES_DB: ${POSTGRES_DB:-ytkb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ytkb} -d ${POSTGRES_DB:-ytkb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ytkb}:${POSTGRES_PASSWORD:-ytkb}@postgres:5432/${POSTGRES_DB:-ytkb}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn ytkb.api.app:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ytkb}:${POSTGRES_PASSWORD:-ytkb}@postgres:5432/${POSTGRES_DB:-ytkb}
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m ytkb.cli scheduler

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  pgdata:
