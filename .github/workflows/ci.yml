name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ytkb
          POSTGRES_PASSWORD: ytkb
          POSTGRES_DB: ytkb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ytkb -d ytkb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ytkb:ytkb@localhost:5432/ytkb
      TEST_DATABASE_URL: postgresql+asyncpg://ytkb:ytkb@localhost:5432/ytkb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Types (mypy)
        run: mypy src
      - name: Enable extensions
        run: |
          PGPASSWORD=ytkb psql -h localhost -U ytkb -d ytkb \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Migrate
        run: alembic upgrade head
      - name: Tests
        run: pytest -q
